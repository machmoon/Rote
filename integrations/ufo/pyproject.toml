# A third-party UFO extension: "a Python package that imports only `ufo.sdk` and declares one entry point"
# (github.com/ufo-ai/ufo-core README.md "Extend it"; spec.md "Extension system"). The loader discovers it through the
# `ufo.extension` entry-point group (core/src/ufo/host/ext/loader.py discovered()).
[project]
name = "ufo-ext-pilot"
version = "0.1.0"
description = "Pilot for UFO: call website search APIs a Claude Code agent learned once and custos proved, via GBrain"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = ["fastmcp>=3.4.2", "pydantic>=2.9"]   # both already in ufo-core's own dependency list

[project.entry-points."ufo.extension"]
pilot = "ufo_ext_pilot:manifest"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["ufo_ext_pilot.py"]
